  evolution:
    title: A path from simple claims to relationships
    intro: Add precision as your product evolves. Select a stage to explore.
    modelsLabel: Authorization models
    claims:
      title: Claims
      eyebrow: 01 / A CAPABILITY
      description: Start with feature access or simple capabilities expressed as actions.
      example: !md |
        ```ts
        can('read:project');
        can('update:project');
        can('manage:workspace');
        ```
      detail: A stable API for simple permissions, ready to gain resource context when you need it.
    actions:
      title: Actions / Subjects
      eyebrow: 02 / ADD A RESOURCE
      description: 'Give every layer a shared vocabulary: what action, on which resource?'
      example: !md |
        ```ts
        can('read', 'Project');
        can('update', 'Project');
        can('manage', 'Workspace');
        ```
      detail: The same capability vocabulary now distinguishes articles, projects, and workspaces.
    rbac:
      title: RBAC
      eyebrow: 03 / GROUP PERMISSIONS
      description: Map roles to rules once, instead of scattering role checks across features.
      example: !md |
        ```ts
        can('read', 'Project');
        if (user.role === 'projectAdmin') can('update', 'Project');
        if (user.role === 'workspaceAdmin') can('manage', 'Workspace');
        ```
      detail: Roles become bundles of action/resource permissions.
    abac:
      title: ABAC
      eyebrow: 04 / ADD CONTEXT
      description: Refine permissions with ownership, tenant identity, or resource state.
      example: !md |
        ```ts
        can('read', 'Project', { tenantId: user.tenantId });
        if (user.role === 'projectAdmin') {
          can('update', 'Project', { tenantId: user.tenantId });
        }
        if (user.role === 'workspaceAdmin') {
          can('manage', 'Workspace', { tenantId: user.tenantId });
        }
        ```
      detail: Roles can still grant permissions; attributes constrain which records those grants cover.
    rebac:
      title: ReBAC
      eyebrow: 05 / FOLLOW RELATIONSHIPS
      description: Add workspace membership and resource administrator relationships on top of tenant isolation.
      approachesLabel: Relationship implementation
      denormalized:
        label: Denormalized
        example: !md |
          ```ts
          can('read', 'Project', {
            tenantId: user.tenantId,
            workspaceMemberIds: { $in: [user.id] }
          });

          can('update', 'Project', {
            tenantId: user.tenantId,
            projectAdminIds: { $in: [user.id] }
          });

          can('manage', 'Workspace', {
            tenantId: user.tenantId,
            workspaceAdminIds: { $in: [user.id] }
          });
          ```
        detail: !md |-
          **Denormalized:** Fast, local permission checks. Requires keeping derived membership attributes synchronized.
      sql:
        label: SQL relations
        example: !md |
          ```ts
          can('read', 'Project', {
            tenantId: user.tenantId,
            workspace: {
              is: {
                memberships: { some: { userId: user.id } }
              }
            }
          });

          can('update', 'Project', {
            tenantId: user.tenantId,
            memberships: {
              some: { userId: user.id, role: 'projectAdmin' }
            }
          });

          can('manage', 'Workspace', {
            tenantId: user.tenantId,
            memberships: {
              some: { userId: user.id, role: 'workspaceAdmin' }
            }
          });
          ```
        detail: !md |-
          **SQL relations:** Evaluate permissions through existing database relationships with @casl/prisma. No duplicated membership lists.
    caption: >-
      Complementary models, not mandatory migrations. RBAC, ABAC, and relationship-derived permissions can
      coexist.
