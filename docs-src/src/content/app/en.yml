exampleCode: !md |
  ```js
  import { Ability, AbilityBuilder } from '@casl/ability';
  import { toMongoQuery } from '@casl/mongoose';

  // Define permissions once
  const { can, cannot, build } = new AbilityBuilder(Ability);

  can('read', ['Post', 'Comment']);
  can('manage', 'Post', { author: 'me' });
  can('create', 'Comment');

  const ability = build();

  // Enforce them across your application
  ability.can('read', 'Post') // UI & API
  toMongoQuery(ability, 'Post', 'update') // Database conditions
  ```

features:
  isomorphic:
    title: Isomorphic
    description: |-
      Use the same authorization rules across frontend and backend, with integrations for popular frameworks and ORMs.
  versatile:
    title: Versatile
    description: |-
      From simple claim-based checks to action/resource permissions, supporting both RBAC and fine-grained ABAC.
  typesafe:
    title: TypeSafe
    description: |-
      TypeScript-first APIs catch mistakes early and provide a better developer experience.
  treeshakable:
    title: Tree shakable
    description: |-
      Just 6kB minified and gzipped, with tree shaking to keep bundles even smaller.
  declarative:
    title: Serializable
    description: |-
      Define permissions once. Serialize and share rules across frontend, APIs, and microservices.

