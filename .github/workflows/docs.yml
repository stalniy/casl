name: Docs

on:
  push:
    branches: [main, next, docs-fix]
    paths:
      - docs-src/**/*
      - .github/workflows/docs.yml
      - .github/actions/setup-deps/action.yml
      - packages/casl-ability/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - packages/casl-mongoose/README.md
      - packages/casl-react/README.md
      - packages/casl-vue/README.md
      - packages/casl-angular/README.md
      - packages/casl-prisma/README.md
  workflow_dispatch:

# Allow the deployment step to push generated files to gh-pages.
permissions:
  contents: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CASL_VERSION: v7
      SITEMAP_WEBSITE: https://casl.js.org
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup-deps
    - name: Cache dependencies
      uses: actions/cache@v5
      env:
        cache-name: casl-docs-deps
      with:
        path: ~/.npm
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('docs-src/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-build-${{ env.cache-name }}-
          ${{ runner.os }}-build-
          ${{ runner.os }}-
    - name: Install deps
      working-directory: docs-src
      run: npm install
    - name: Test
      working-directory: docs-src
      run: npm run test
    - name: Build documentation
      working-directory: docs-src
      env:
        NODE_ENV: production
        LIT_APP_PUBLIC_PATH: "/${{ env.CASL_VERSION }}"
        LIT_APP_CASL_VERSION: "${{ env.CASL_VERSION }}"
      run: LIT_APP_COMMIT_HASH=$(git rev-parse --short "$GITHUB_SHA") npm run build
    - name: Build sitemap
      working-directory: docs-src
      env:
        LIT_APP_PUBLIC_PATH: "/${{ env.CASL_VERSION }}"
      run: npm run build.sitemap
    - name: Prerender
      working-directory: docs-src
      env:
        LIT_APP_PUBLIC_PATH: "/${{ env.CASL_VERSION }}"
      run: npm run prerender
    - name: Deploy
      env:
        GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        GITHUB_ACTOR: docs
      run: |
        CASL_DOCS_ROOT="./${CASL_VERSION}"
        CURRENT_BRANCH=$(git branch --show-current)
        cat <<- EOF > "$HOME/.netrc"
          machine github.com
          login $GITHUB_ACTOR
          password $GITHUB_TOKEN
          machine api.github.com
          login $GITHUB_ACTOR
          password $GITHUB_TOKEN
        EOF
        chmod 600 "$HOME/.netrc"
        git config --global user.email "$GITHUB_ACTOR@users.noreply.github.com"
        git config --global user.name "$GITHUB_ACTOR"
        git fetch origin gh-pages
        git checkout -f gh-pages
        rm -rf "$CASL_DOCS_ROOT"
        mv docs-src/dist "$CASL_DOCS_ROOT"
        touch .nojekyll

        if [ "$CURRENT_BRANCH" = "main" ]; then
          cp -R "$CASL_DOCS_ROOT/web-root/." .
          cp "$CASL_DOCS_ROOT/versions.txt" .
          cp "$CASL_DOCS_ROOT/en/index.html" ./index.html
        fi

        git add .
        git commit -m "chore(release): deploy ${CASL_DOCS_ROOT}"
        git push --set-upstream origin gh-pages
    - name: Prepare Pages artifact
      run: |
        mkdir -p "$RUNNER_TEMP/casl-pages"
        git archive HEAD | tar -x -C "$RUNNER_TEMP/casl-pages"
    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v4
      with:
        path: ${{ runner.temp }}/casl-pages
    - name: Restore source checkout for action cleanup
      if: always()
      run: git checkout -f "$GITHUB_SHA"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
