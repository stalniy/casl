name: CI

on:
  push:
    branches: [ability-5.x]
    paths:
      - .github/workflows/main.yml
      - packages/**/*.{js,ts,json}
      - '*.{json,js}'
      - .eslintrc
      - tools/**/*
  pull_request:
    branches: [ability-5.x]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node:
          - 10 # 2020-04-01
          - 12
          # - latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node }}
        package-manager-cache: false
    - uses: pnpm/action-setup@v1.2.1
      with:
        version: 5.15.0
    - name: Cache dependencies
      uses: actions/cache@v5
      env:
        cache-name: casl-deps
      with:
        path: ~/.pnpm-store
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('./pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-build-${{ env.cache-name }}-
          ${{ runner.os }}-build-
          ${{ runner.os }}-
    - name: Install dependencies
      run: pnpm install --filter '!@casl/prisma'
    - name: Build
      run: pnpm run -r --filter '!@casl/prisma' build
    - name: lint & test
      run: |
        pnpm run -r lint --filter '!@casl/prisma'
        pnpm run -r test --filter '!@casl/prisma' -- --coverage
    - name: submit coverage
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      run: pnpm run coverage.submit
