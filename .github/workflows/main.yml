name: CI

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/main.yml
      - packages/**/*.{js,ts,json}
      - '*.{json,js}'
      - .eslintrc
      - tools/**/*
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        option:
          - node-version: 22 # 2026-12-07
          - node-version: 24 # 2027-06-16
          - node-version: 26 # 2029-04-30
            submit-coverage: true
          - node-version: '*'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.sha }}
        fetch-depth: 2
        persist-credentials: false
    - uses: $/.github/actions/setup-deps
      with:
        node-version: ${{ matrix.option.node-version }}
    - name: Get base sha
      id: base-commit
      run: |
        echo "sha=${{ github.event.pull_request.base.sha || github.event.before }}" >> $GITHUB_OUTPUT
    - name: Build
      env:
        BASE_COMMIT_SHA: ${{ steps.base-commit.outputs.sha }}
      run: |
        if [[ "$GITHUB_EVENT_NAME" != "pull_request" || $(git diff --name-only HEAD^1 HEAD | grep casl-) = "" ]]; then
          pnpm run -r build
        else
          pnpm run -r --filter "[$BASE_COMMIT_SHA]..." build
        fi
    - name: lint
      env:
        BASE_COMMIT_SHA: ${{ steps.base-commit.outputs.sha }}
      run:  |
        if [[ "$GITHUB_EVENT_NAME" != "pull_request" || $(git diff --name-only HEAD^1 HEAD | grep casl-) = "" ]]; then
          pnpm run -r lint
        else
          pnpm run -r --filter "[$BASE_COMMIT_SHA]..." lint
        fi
    - name: test
      env:
        BASE_COMMIT_SHA: ${{ steps.base-commit.outputs.sha }}
      run:   |
        if [[ "$GITHUB_EVENT_NAME" != "pull_request" || $(git diff --name-only HEAD^1 HEAD | grep casl-) = "" ]]; then
          pnpm run -r  test --coverage
        else
          pnpm run -r --filter "[$BASE_COMMIT_SHA]..." test --coverage
        fi
    - name: Submit coverage
      if: matrix.option.submit-coverage == true
      uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
      with:
        fail_ci_if_error: true
        token: ${{ secrets.CODECOV_TOKEN }}
        verbose: true # optional (default = false)
