name: release-please

on:
  push:
    branches:
      - ability-5.x
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      paths_released: ${{ steps.release-pl.outputs.paths_released }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@v4
        id: release-pl
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target-branch: ${{ github.ref_name }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
  publish:
    runs-on: ubuntu-latest
    needs: release
    if: ${{ needs.release.outputs.paths_released && needs.release.outputs.paths_released != '[]' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-deps
        with:
          node-version: '12.17.0'
      - name: Prepare packages
        env:
          PATHS_RELEASED: ${{ needs.release.outputs.paths_released }}
        run: |
          echo "$PATHS_RELEASED" | jq -r '.[]' | while IFS= read -r p; do
            pnpm --filter "./$p" run release.prepare
          done
      # Trusted publishing requires at least node 22.14 and npm 11.5.1
      - uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Publish packages
        env:
          PATHS_RELEASED: ${{ needs.release.outputs.paths_released }}
        run: |
          echo "$PATHS_RELEASED" | jq -r '.[]' | while IFS= read -r p; do
            (cd "$p" && pnpm publish --publish-branch ability-5.x --tag ability-5x);
          done
