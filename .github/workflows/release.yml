name: release-please

on:
  push:
    branches: [main, next]

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      paths_released: ${{ steps.release-pl.outputs.paths_released }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release-pl
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target-branch: ${{ github.ref_name }}
          config-file: ${{ github.ref_name == 'next' && 'release-please-config-next.json' || 'release-please-config.json' }}
          manifest-file: ${{ github.ref_name == 'next' && '.release-please-manifest-next.json' || '.release-please-manifest.json' }}
  publish:
    runs-on: ubuntu-latest
    needs: release
    if: ${{ needs.release.outputs.paths_released && needs.release.outputs.paths_released != '[]' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify release commit
        shell: bash
        run: | # shell
          git fetch --no-tags origin main

          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release commit is not on main"
            exit 1
          fi
      - uses: $/.github/actions/setup-deps
      - name: Publish packages
        env:
          RELEASE_DIST_TAG: ${{ github.ref_name == 'next' && 'next' || 'latest' }}
          RELEASE_PUBLISH_BRANCH: ${{ github.ref_name }}
          PATHS_RELEASED: ${{ needs.release.outputs.paths_released }}
        run: | # shell
          pnpm run --dir packages/casl-ability build
          while IFS= read -r p; do
            pnpm -r --filter "./$p" release
          done < <(jq -r '.[]' <<<"$PATHS_RELEASED")
