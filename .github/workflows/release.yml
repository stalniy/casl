name: release-please

on:
  push:
    branches: [ability-5.x]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      paths_released: ${{ steps.release-pl.outputs.paths_released }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release-pl
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target-branch: ${{ github.ref_name }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
  build:
    runs-on: ubuntu-latest
    needs: release
    if: ${{ needs.release.outputs.paths_released && needs.release.outputs.paths_released != '[]' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-deps
        with:
          node-version: '12.17.0'
      - name: Prepare packages
        env:
          PATHS_RELEASED: ${{ needs.release.outputs.paths_released }}
        run: | # shell
          mkdir -p "$GITHUB_WORKSPACE/release-packages"
          pnpm --dir packages/casl-ability run build
          while IFS= read -r p; do
            pnpm --filter "./$p" run release.prepare
            package_dir="$GITHUB_WORKSPACE/$p"
            pack_dir=$(mktemp -d)
            pnpm --dir "$package_dir" pack --pack-destination "$pack_dir"
            mv "$pack_dir"/*.tgz "$GITHUB_WORKSPACE/release-packages/${p##*/}.tgz"
          done < <(jq -r '.[]' <<<"$PATHS_RELEASED")
      - name: Upload built packages
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-packages
          path: release-packages/*.tgz
          if-no-files-found: error
  publish:
    runs-on: ubuntu-latest
    needs: [release, build]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify release commit
        shell: bash
        run: | # shell
          git fetch --no-tags origin ability-5.x

          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/ability-5.x; then
            echo "::error::Release commit is not on ability-5.x"
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
          check-latest: true
      - name: Download built packages
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-packages
          path: release-packages
      - name: Publish packages
        env:
          RELEASE_DIST_TAG: ability-5x
          PATHS_RELEASED: ${{ needs.release.outputs.paths_released }}
        run: | # shell
          while IFS= read -r p; do
            npm publish "$GITHUB_WORKSPACE/release-packages/${p##*/}.tgz" --tag "$RELEASE_DIST_TAG" --ignore-scripts
          done < <(jq -r '.[]' <<<"$PATHS_RELEASED")
