name: Setup dependencies
description: Install the dependencies for the ability 5.x release toolchain

inputs:
  node-version:
    description: Node.js version to install
    default: '22.14.0'

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        package-manager-cache: false
        check-latest: true
    - name: Install pnpm
      shell: bash
      # The pinned, bundled pnpm CLI supports legacy Node; the current action installer does not.
      run: npm install --global pnpm@6.35.1 # zizmor: ignore[adhoc-packages]
    - name: Get pnpm store directory
      id: pnpm-cache
      shell: bash
      run: echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
        key: ${{ runner.os }}-ability-5x-${{ inputs.node-version }}-${{ hashFiles('pnpm-lock.yaml') }}
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
