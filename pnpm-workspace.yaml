packages:
  - packages/*
allowBuilds:
  '@parcel/watcher': false
  '@prisma/engines': true
  better-sqlite3: true
  esbuild: true
  lmdb: false
  msgpackr-extract: false
  prisma: true
  unrs-resolver: true

minimumReleaseAge: 10080

minimumReleaseAgeExclude:
  - nanoid@3.3.17

overrides:
  "minimatch@3>brace-expansion": 1.1.18
  "minimatch@10>brace-expansion": 5.0.9
  "postcss@8>nanoid": 3.3.17
